[project]
name = "hello-ai-agent"
version = "0.1.0"
description = "Simple AI Agent with CrewAI"
requires-python = ">=3.11"
dependencies = [
    "crewai",
    "crewai-tools",
    "langchain-community",
    "ddgs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chubai"]
